<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* Beamertauglich: helles Theme, Schrift ≥ 18 px, kein horizontales Scrollen bei 1280 × 720.
       Code-Score = Blau, Judge-Score = Orange (wie im abgestimmten Entwurf). */
    :root { --ink: #1f2933; --muted: #52606d; --line: #d9e2ec; --bg: #ffffff; --soft: #f5f7fa; --accent: #2f5fd0;
            --code: #2a6fdb; --judge: #c25e00; --lead: #f0b429; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px 24px 24px; font: 20px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
           color: var(--ink); background: var(--bg); overflow-wrap: anywhere; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; }
    h1 { font-size: 28px; margin: 0; }
    .status { color: var(--muted); font-size: 18px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 12px; }
    nav button { font: inherit; font-size: 19px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px;
                 background: var(--soft); color: var(--ink); cursor: pointer; }
    nav button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; background: var(--bg); }
    .tile.empty { opacity: .55; }
    .tile.lead { border: 3px solid var(--lead); box-shadow: 0 0 0 3px rgba(240, 180, 41, .25); }
    .tile h2 { font-size: 24px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
    .badge { font-size: 18px; font-weight: 600; color: #7a5a00; }
    .nums { display: flex; gap: 32px; margin-bottom: 6px; }
    .num small { display: block; font-size: 18px; color: var(--muted); }
    .num b { font-size: 40px; line-height: 1.1; }
    .num span { font-size: 18px; color: var(--muted); }
    .truth { font-size: 18px; margin: 0 0 6px; }
    .num.code b { color: var(--code); }
    .num.judge b { color: var(--judge); }
    .prompt { font: 18px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--soft);
              border-radius: 8px; padding: 6px 10px; max-height: 4.2em; overflow: hidden; cursor: pointer;
              white-space: pre-wrap; }
    .prompt.open { max-height: none; }
    .meta { font-size: 18px; color: var(--muted); margin-top: 4px; }
    .chart { position: relative; height: 112px; }
    .curve .prompt { max-height: 1.6em; }
    .curve .prompt.open { max-height: none; }
    .legend { font-size: 18px; color: var(--muted); margin: 0 0 8px; }
    .legend b { color: var(--ink); }
    .legend i { display: inline-block; width: 18px; height: 4px; vertical-align: middle; margin: 0 6px 0 14px; }
    @media (max-width: 760px) { .tiles { grid-template-columns: minmax(0, 1fr); } body { padding: 12px 16px; } }
  </style>
</head>
<body>
  <header>
    <h1>Scoreboard · LLM-as-a-Judge</h1>
    <span class="status">Session: <strong id="session">–</strong> · <span id="status">lädt …</span></span>
  </header>
  <nav>
    <button data-round="1">1 Frei ausprobieren</button>
    <button data-round="2">2 Rollen vergleichen</button>
    <button data-round="3">3 Komplexität</button>
    <button data-round="4">4 AI Challenge</button>
  </nav>
  <p class="legend" id="legend"></p>
  <div class="tiles" id="tiles"></div>

  <script>
    const REFRESH_MS = 10000;
    let round = String(window.INITIAL_VIEW || 1);
    let data = null;
    let charts = [];
    const openPrompts = new Set();

    function esc(value) {
      return String(value === null || value === undefined ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function fmt(value) {
      if (value === null || value === undefined || value === "") return "–";
      return Number(value).toLocaleString("de-DE", { maximumFractionDigits: 2 });
    }

    function ago(iso) {
      const t = Date.parse(iso);
      if (!t) return "";
      const minutes = Math.max(0, Math.round((Date.now() - t) / 60000));
      return minutes < 1 ? "gerade eben" : "vor " + minutes + " min";
    }

    function fehlalarme(n) {
      return n === 1 ? "1 Fehlalarm" : fmt(n) + " Fehlalarme";
    }

    function truth(t, long) {
      if (t.gefunden === null || t.gefunden === undefined) return "";
      const found = long ? fmt(t.gefunden) + " von " + fmt(t.fehler_gesamt) + " echten Fehlern gefunden"
                         : "gefunden " + fmt(t.gefunden) + " von " + fmt(t.fehler_gesamt);
      return "<div class='truth'>✔ " + found + " · ✘ " + fehlalarme(t.fehlalarme) + "</div>";
    }

    function promptBox(group, text) {
      const open = openPrompts.has(group) ? " open" : "";
      return "<div class='prompt" + open + "' data-group='" + esc(group) + "' title='" + esc(text) + "'>" +
        esc(text) + "</div>";
    }

    function emptyTile(group) {
      const text = data.connected[group] ? "verbunden – noch nichts gesendet" : "noch nichts gesendet";
      return "<div class='tile empty'><h2>" + esc(group) + "</h2><div class='meta'>" + text + "</div></div>";
    }

    function scoreTile(group, t, extra, lead) {
      return "<div class='tile" + (lead ? " lead" : "") + "'><h2><span>" + esc(group) + "</span>" +
        (lead ? "<span class='badge'>🏆 vorne</span>" : "") + "</h2>" +
        "<div class='nums'><div class='num judge'><small>Judge-Score</small><b>" + fmt(t.judge_score) + "</b>" +
        (t.judge_max === null || t.judge_max === undefined ? "" : " <span>von max. " + fmt(t.judge_max) + "</span>") +
        "</div><div class='num code'><small>Code-Score</small><b>" + fmt(t.code_score) + "</b> <span>von 10</span>" +
        "</div></div>" + truth(t, true) +
        promptBox(group, t.prompt) +
        "<div class='meta'>" + esc(extra) + " · " + esc(t.modell) + " · " + ago(t.timestamp) + "</div></div>";
    }

    function curveTile(group, c, index) {
      return "<div class='tile curve'><h2>" + esc(group) + "</h2>" +
        "<div class='chart'><canvas id='chart-" + index + "'></canvas></div>" +
        truth(c, false) + promptBox(group, c.prompt) +
        "<div class='meta'>" + esc(c.modell) + " · " + ago(c.timestamp) + "</div></div>";
    }

    function drawChart(index, c) {
      const canvas = document.getElementById("chart-" + index);
      if (!canvas || !window.Chart) return;
      const labels = c.points.map((p) => [p.komplexitaet, p.snippet.replace(/^qb_/, "")]);
      const judgeMax = c.judge_max === null || c.judge_max === undefined ? 2 : c.judge_max;
      const judgeValues = c.points.map((p) => p.judge_score).filter((v) => v !== null);
      const judgeMin = Math.min(0, ...judgeValues);
      charts.push(new Chart(canvas, {
        type: "line",
        data: { labels, datasets: [
          { label: "Code-Score", data: c.points.map((p) => p.code_score), yAxisID: "code",
            borderColor: "#2a6fdb", backgroundColor: "#2a6fdb", borderWidth: 3, pointRadius: 5, spanGaps: true },
          { label: "Judge-Score", data: c.points.map((p) => p.judge_score), yAxisID: "judge",
            borderColor: "#c25e00", backgroundColor: "#c25e00", borderWidth: 3, pointRadius: 5, spanGaps: true },
          { label: "max.", data: c.points.map(() => judgeMax), yAxisID: "judge", borderColor: "#c25e00",
            borderDash: [6, 5], borderWidth: 1.5, pointRadius: 0 },
        ] },
        options: {
          animation: false, maintainAspectRatio: false, plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { font: { size: 14 } } },
            code: { position: "left", min: 0, max: 10, title: { display: true, text: "Code", color: "#2a6fdb" },
                    ticks: { color: "#2a6fdb", font: { size: 14 } } },
            judge: { position: "right", grid: { drawOnChartArea: false }, min: judgeMin, max: judgeMax,
                     title: { display: true, text: "Judge", color: "#c25e00" },
                     ticks: { color: "#c25e00", font: { size: 14 }, precision: 0 } },
          },
        },
      }));
    }

    function render() {
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.round === round));
      if (!data) return;
      document.getElementById("session").textContent = data.session || "–";
      charts.forEach((chart) => chart.destroy());
      charts = [];
      const tiles = data.rounds[round] || {};
      const legend = document.getElementById("legend");
      const explain = "<b>Code-Score</b>: Note des Modells für den Code (0–10) · <b>Judge-Score</b>: +2 je gefundenem " +
        "echten Fehler, −1 je Fehlalarm";
      legend.innerHTML = explain + (round === "3"
        ? "<br><i style='background:var(--code)'></i>Code-Score (links)<i style='background:var(--judge)'></i>" +
          "Judge-Score (rechts, gestrichelt = max.)"
        : round === "4" ? "<br>Runde 4: Judge-Score und Treffer summiert über 5 Snippets, Code-Score = Durchschnitt" : "");
      const html = data.groups.map((g, i) => {
        const t = tiles[g];
        if (!t) return emptyTile(g);
        if (round === "3") return curveTile(g, t, i);
        if (round === "4") return scoreTile(g, t, t.n + "/5 Snippets", data.leaders.indexOf(g) >= 0);
        return scoreTile(g, t, t.snippet, false);
      });
      document.getElementById("tiles").innerHTML = html.join("");
      if (round === "3") data.groups.forEach((g, i) => { if (tiles[g]) drawChart(i, tiles[g]); });
      document.querySelectorAll(".prompt").forEach((box) => box.addEventListener("click", () => {
        const group = box.dataset.group;
        if (openPrompts.has(group)) openPrompts.delete(group); else openPrompts.add(group);
        box.classList.toggle("open");
      }));
    }

    function load() {
      const status = document.getElementById("status");
      if (!window.google || !google.script) {
        status.textContent = "Nur als Apps-Script-Web-App lauffähig (siehe docs/DASHBOARD_TEST.md).";
        return;
      }
      google.script.run
        .withSuccessHandler((d) => {
          data = d;
          status.textContent = "aktualisiert " + new Date().toLocaleTimeString("de-DE");
          render();
        })
        .withFailureHandler((err) => { status.textContent = "Fehler beim Laden: " + err.message; })
        .getData();
    }

    function showRound(n) {
      round = String(n);
      render();
      window.scrollTo(0, 0);
    }

    document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => showRound(b.dataset.round)));
    document.addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (/^[1-4]$/.test(event.key)) showRound(event.key);
    });
    render();
    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
